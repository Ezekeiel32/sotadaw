# Checks that run on every pull request and on main. The full three-platform build lives in release.yml.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python sources compile
        run: python -m compileall -q agent tools

      - name: JSON files parse
        run: |
          python - <<'PY'
          import json, pathlib, sys
          files = [*pathlib.Path("agent").glob("*.json"), *pathlib.Path("songs").glob("*.json"),
                   *pathlib.Path("library").rglob("*.json"), pathlib.Path("library.json")]
          bad = []
          for p in files:
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  bad.append(f"{p}: {e}")
          print(f"{len(files)} JSON files checked, {len(bad)} failed")
          print("\n".join(bad))
          sys.exit(1 if bad else 0)
          PY

      - name: Install Faust
        run: sudo apt-get update -qq && sudo apt-get install -y -qq faust

      - name: Faust instruments compile
        run: |
          fail=0; n=0
          for f in instruments/*.dsp; do
            n=$((n+1))
            faust -lang cpp "$f" -o /dev/null || { echo "::error file=$f::Faust compile failed"; fail=1; }
          done
          echo "$n instruments checked"
          exit $fail
